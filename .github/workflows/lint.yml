name: Lint Python

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: setup Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"
    - name: install poetry
      run: pip install poetry wheel
    - name: install dependencies
      run: poetry install --only=dev --no-root
    - name: flake8 check
      run: poetry run flake8 scrapers scrapers_next
    - name: black check
      run: poetry run black --check --diff scrapers scrapers_next
    # The motion-classification tests need only pytest and pyyaml, not the scrapers' runtime
    # dependencies, so they run here without a full install. (OPEN-426: four of them went stale
    # for months because nothing ran them.)
    - name: motion classification tests
      run: |
        pip install pytest pyyaml
        pytest tests/test_classify_motion.py
