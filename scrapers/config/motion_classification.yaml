# Motion passage classification patterns per jurisdiction.
# Loaded once at import time by classify_motion.py.
#
# All patterns use re.search. Anchor with ^ for prefix matching.
# Evaluation order per jurisdiction: bill_action → not_passage → committee_passage → passage → default.
# default: null returns [] for unrecognised texts; default: passage returns ["passage"].

jurisdictions:
  us:
    not_passage:
      - "^on cloture on the motion to proceed"   # scheduling vote, not passage cloture
      - "^measure laid before"
      - "^resolving differences"
      - "^postponed proceedings"
      - "^ordered to be reported"
    passage:
      - "^on passage"
      - "^on motion to suspend the rules and"
      - "^on agreeing to the resolution"
      - "^on the joint resolution"
      - "^on the concurrent resolution"
      - "^on the resolution [a-z]"
      - "^on the cloture motion"                 # "On the Cloture Motion (S.XXX)" — genuine passage cloture
      - "^passed senate"
      - "^passed house"
      - "^passage,"
    default: null

  # OPEN-625: these text rules apply only to Third and Final Reading roll calls. Every other floor
  # step (Committee of the Whole, its motions to amend, reconsiderations, ...) is not a vote on the
  # bill whatever its text: vote_classification() in az/bills.py, from the roll call's FloorHeader.
  az:
    committee_passage:
      - "^do pass"                               # "do pass", "do pass amended" — committee votes
    passage:
      - "^passed$"
      - "^failed to pass$"
    default: null

  ut:
    not_passage:
      - "passed 2nd reading$"                    # standalone 2nd-reading advancement vote (not final)
    passage:
      - "^house/ passed 3rd reading"
      - "^senate/ passed 3rd reading"
      - "^house/ passed on 3rd reading"
      - "^senate/ passed on 3rd reading"
      - "^house/ passed 2nd & 3rd readings"      # suspension of rules = combined final passage
      - "^senate/ passed 2nd & 3rd readings"
      - "^house/ failed$"                        # failed passage vote
      - "^senate/ failed$"
      - "concurs with"                            # chamber concurrence = passage
      - "conference committee - final passage"    # "House/Senate Conference Committee - Final Passage"
    default: null

  fl:
    # floor-vote site only — committee-passage sites are already correctly hardcoded
    # the complete audit of this site found fewer than 12 non-passage texts
    # unknown future floor texts default to passage and surface in validate_scorecards check #9
    not_passage:
      - "second reading"
      - "2nd reading"
      - "placed on"
      - "^amendment"                             # anchored so "Favorable with 1 amendment" still defaults to passage
    default: passage                             # catch-all for floor-vote site

  # OPEN-590 (Georgia, gate E). The motion text is the roll call's Caption in Georgia's vote service
  # (GetVote). Rules written from every caption of sessions 2025_26 and 2026_ss (GetVotes, House and
  # Senate, 1,917 roll calls, read 2026-11-16). House and Senate local bills are voted as a calendar
  # ("Local Calendar", "LOCAL CONSENT CALENDAR"): passage for each bill on it. The caption does not
  # change when the House reconsiders a calendar, so the ga scraper (vote_classification() in
  # ga/bills.py) unclassifies a calendar roll call that the bill's status history pairs with a
  # "Reconsidered" status. Pass/fail comes from the status history too ("... Lost"), and for a veto
  # override from the two_thirds list below (vote_result() in ga/bills.py).
  ga:
    # OPEN-590 follow-up (review 20779): the procedure rules are anchored (a word boundary or the
    # start of the caption), so a future caption that only contains one of these letters, or an
    # "ADOPT AMENDMENT ...", cannot change label by accident.
    not_passage:
      - '\brecon(sider(ation)?)?\b'              # "Reconsider", "MOTION FOR RECONSIDERATION", "SB614 & SB627 RECON", "MOTION TO RECONSIDER LOCAL CONSENT CALENDAR"
      - '^adopt(ion of)? (the )?((floor|committee) )?amend'  # Senate floor amendments: "ADOPTION OF AMENDMENT #1 BY THE SENATOR FROM THE 44TH", "ADOPTION OF AMEND #1A BY SEN ...", and any "ADOPT AMENDMENT ..."; not "ADOPTION OF CONSTITUTIONAL AMENDMENT"
      - '^am \d'                                 # an amendment's number: "AM 62 0077"
      - '\btable\b'                              # "MOTION TO TABLE", "TABLE", "MOTION TO REMOVE FROM THE TABLE", "MOTION TO TABLE REMAINING LEGISLATION ON THE RULES CALENDAR"
      - '\bengross'                              # "MOTION TO ENGROSS" (closes a bill to amendment)
      - "previous question"
      - "withdraw and commit"
      - "ruling of the chair"
      - '^(motion to )?suspend\b'                # "MOTION TO SUSPEND SENATE RULE 7-1-6(b)"
      - "immediately transmit"                   # "Immediately Transmit", "MOTION TO IMMEDIATELY TRANSMIT TO GOVERNOR"
      - "resolve debate"
      - '^(motion to )?adjourn'                  # "MOTION TO ADJOURN", "Adjournment"
      - '\brecede\b'                             # "RECEDE FROM SENATE AMENDMENT"
      - '\bpostpone'                             # not in 2025_26 or 2026_ss; the scraper's old label list had POSTPONE
      - '\bdisagree'                             # likewise DISAGREE (a refusal to concur, not passage)
      - '\binsist'                               # likewise INSIST
      - "^motion to print$"
      - "^move from "                            # committee move: "Move from P&CH to Hth"
      - "^remove from local cal"                 # "Remove from Local Cal/Vote Separately"
    passage:
      - "passage"                                # "PASSAGE", "PASSAGE BY SUBSTITUTE", "PASSAGE AS AMENDED", "SBs 234,  235,  & 336 Passage"
      - "^agree to "                             # concurrence: "AGREE TO HOUSE SUBSTITUTE", "Agree to Senate Sub as Am" (ut, mi, wa, va, al, nc)
      - "^adopt"                                 # "ADOPT", "ADOPTION" (resolutions), "ADOPTION OF CONSTITUTIONAL AMENDMENT", "ADOPT CONFERENCE COMMITTEE REPORT", "Adopt CCR"
      - "veto override"                          # Ramon, 2026-11-16 (for nc): "Veto overrides count as passage"
      - "local (consent )?calendar"              # "Local Calendar", "Local Calendar as a Whole", "Previous Local Calendar", "Supplemental Local Calendar #2", "LOCAL CONSENT CALENDAR"
      - "^consent calendar "                     # Senate resolutions: "CONSENT CALENDAR FOR SENATE STUDY COMMITTEES", "... EXPRESSING THE WILL OF THE SENATE"
      - "^uncontested house resolutions$"
    default: null                                # attendance, roll calls, confirmations, "Speaker of the House", "Dispense with Reading of Journal"
    # Motions decided by two thirds of the members, not yeas > nays. Read only by
    # needs_two_thirds() (the ga scraper's pass/fail), never by classify_motion(). Ga. Const.
    # art. V, sec. II, para. IV: a veto is overridden by two thirds of the members of each house.
    two_thirds:
      - '^(motion to )?(veto override|override (the )?(governor''?s )?veto)'  # "Veto Override" (HB 1192, 2026_ss, House #11, 94-77: failed)

  mi:
    passage:
      - "^passed"                                # roll call# embedded after the verb
      - "^passage"
      - "^the bill"
      - "concurred in"                           # chamber concurrence = passage
      - "^conference report adopted"             # conference committee resolution
      - "^senate adopted conference report"      # Senate variant
    default: null

  ma:
    not_passage:
      - "^amendment"                             # amendment adopted/rejected
      - "^item .+ passed over veto"              # budget line-item veto override
    passage:
      - "^passed to be engrossed"
      - "^enacted"
      - "^adopted"
      - "^committee of conference report accepted"
    default: null
    # OPEN-561: motions that need two thirds of the members present and voting. Read only by
    # needs_two_thirds() (the vote's pass/fail rule), never by classify_motion().
    two_thirds:
      # Anchored where they can be: a long Senate motion can quote an amendment's text, and an
      # amendment that inserts an emergency preamble needs only a majority.
      - "over (the )?(governor'?s )?veto"        # "Item 4000-0051 passed over veto"
      - "veto (is |was )?(overridden|sustained)"
      - "notwithstanding the objections"         # older form of a veto override
      - "^(h\\. [0-9]+ )?shall item [0-9]{4}-[0-9]{4}"  # House sheet: "H. 4240 Shall item 4000-0051 (...) stand, the objections of the Governor notwithstanding?", cut short
      - "^(motion [^,;]*?)?to suspend the rules" # "Motion (Tarr) to suspend the rules does not prevail"
      - "^(rules suspended|suspension of the rules|suspending the rules)"
      - "^(h\\. [0-9]+ )?(shall the |adopting |adoption of )?(the )?emergency preamble"  # "Emergency preamble adopted"

  wa:
    preprocess: strip_sequence_number            # "Final Passage (#7)" → "final passage"
    passage:
      - "^3rd reading & final passage"
      - "^final passage"
      - "^adoption"                              # "Adoption as Recommended by Conference Committee", "Adoption as Amended"
      - "^concur in"                             # chamber concurrence in amendments
    default: null
    # NOTE: "Motion to Place Measure on 3rd Reading & Final Passage" starts with "Motion"
    # and does NOT match these anchored patterns — confirmed by explicit test.

  # OPEN-705 (Missouri). Two sources (mo/votes.py, OPEN-696), rules written from every 2026 roll call on a bill
  # (463 House, 187 Senate; read 2026-11-20). House: the motion is the roll-call PDF's header joined with " - ":
  # calendar heading, bill line, an amendment line if any ("*HA 1"), sponsor, title, LR number, then a motion
  # line if the vote is on a motion ("PREVIOUS QUESTION", "THAT ... BE REFERRED ..."). The PDF never says what
  # was decided, so the calendar heading decides: third reading is the passage vote; under "HBs WITH SENATE
  # AMENDMENTS" the House adopts the Senate's version and then truly agrees to and finally passes it, and under
  # "BILLS IN CONFERENCE" adopts the CCR and then passes the CCS (concurrence and conference report adoption are
  # passage, pa OPEN-617, la OPEN-583). The emergency clause vote after a bill's passage has the same header;
  # the mo scraper adds " - EMERGENCY CLAUSE" to it (mark_emergency_clauses). Senate: the motion is the journal
  # paragraph ending "by the following vote:". Not passage: perfection, amendments (the mo scraper labels
  # them amendment), previous question, refer/commit, reconsider, emergency clause, refusing a CCR.
  mo:
    not_passage:
      - '\breconsider'                           # "THAT THE VOTE BY WHICH ... WAS THIRD READ AND PASSED BE RECONSIDERED", "moved that the vote by which ... be reconsidered"
      - ' - emergency clause$'                   # House, added by the mo scraper (a title may say "EMERGENCY"); the Senate's "The emergency clause was adopted" matches no passage rule
      - ' - previous question$'
      - ' - \*?that '                            # House motion line: "THAT HCS HB 1667 BE RECOMMITTED ...", "*THAT THE HOUSE REFUSE TO ADOPT CCR ..."
      - ' - \*?ha \d+'                           # House amendment line under a third-reading heading ("SBs FOR THIRD READING - HCS SB 835 - HA 3 - ...")
    passage:
      - '^(h|s|ha)(b|jr|cr)s (for third reading|3rd read(ing)?) - '   # "HBs FOR THIRD READING", "HBs 3rd READ - INFORMAL", "HBs 3rd READING - CONSENT", "HABs" (appropriations), "SCRs"
      - '^hbs (with|w/) ?senate amendments - '   # adopting the Senate's version, then truly agreed to and finally passed
      - '^bills in conference - cc[rs] '         # CCR adopted, then the CCS truly agreed to and finally passed
      - '^bills carrying request messages - '    # FOR RAMON: SB 1408, the House receded and the bill was truly agreed to and finally passed (one seen)
      - '^house resolutions - '                  # FOR RAMON: resolution adoption (HR 1, 2026 veto session, informs the Governor; one seen), as ok "Adopt Resolution"
      - '\bread the 3rd time and (finally )?(passed|failed)\b'   # Senate third reading, also "Was read the 3rd time and passed" after a CCR; "failed" unseen in 2026
      - 'conference committee report\b.* be adopted, which motion (prevailed|failed)'   # "moved that the above conference committee report be adopted"
      - '\bconference committee report was adopted\b'   # "On motion of Senator Black, the above conference committee report was adopted by the following vote:" (day 62 journal)
      - 'moved that (hcs|hs|ha \d+) (for|to) .* be adopted, which motion (prevailed|failed)'   # concurrence in the House's version or amendment
      - ', (hcr|scr|hr|sr) \d+(, as amended[^,]*,)? was adopted\b'   # "On motion of Senator X, HCR 21 was adopted", "SCR 21, as amended by SCS, was adopted"
    default: null                                # anything else (perfection, a Senate substitute adopted, an unseen text) stays unclassified

  va:
    bill_action:                                 # bill_action field is the reliable committee signal
      committee_passage:
        - "^reported from"
        - "^subcommittee recommends reporting"   # not plain "recommends": laying on the table / striking / continuing are not passage
    not_passage:
      - "^constitutional reading dispensed"      # procedural reading waiver, not a vote on passage
      - "^continued to next session"             # carried over to next session
      - "^reconsider"                            # motion to reconsider
      - "^insist"                                # insist & request = bicameral disagreement motion
      - "^subcommittee recommends laying"        # laid on table = killed in committee
      - "^subcommittee recommends striking"      # struck from docket = killed
      - "^subcommittee recommends passing by"    # passed by indefinitely = killed
      - "^subcommittee recommends continuing"    # continued = not passage
      - "^subcommittee recommends referring"     # referred to another committee
      - "^subcommittee recommends incorporating" # incorporated into another bill
    committee_passage:
      - "^subcommittee recommends reporting"     # reported out of subcommittee
      - "^reported from"                         # reported out of full committee (motion_text fallback)
    passage:
      - "^passage"                               # "Passage  R", "Passage-Enrolled Bill  R"
      - "^h vote:"                               # House floor passage (VoteActionDescription fallback)
      - "^s vote:"                               # Senate floor passage
      - "^adopt conference committee report"     # conference committee resolution
      - "^adopt governor"                        # adopting governor's recommendation
      - "^concur house"                          # concurrence in House amendments
      - "^concur senate"                         # concurrence in Senate amendments
      - "^accede conference committee"           # accepting conference committee recommendation
      - '^agree to\b'                            # "Agree to R" = adopted recommendation
      # OPEN-416: LIS now sends the bill's own action text as the vote's motion (it used to send
      # "H VOTE:" and the short "Passage R" family), usually with the tally in parentheses.
      # A failed vote is still a vote on passage, so "defeated" / "rejected" are included.
      # NOTE: patterns with \b are single-quoted on purpose. In a double-quoted YAML string
      # "\b" is a backspace character, not a word boundary (the old "^agree to\b" never matched).
      - '^read third time and (passed|defeated)'          # "Read third time and passed House (96-Y 0-N 0-A)"
      - '^passed (house|senate)\b'                         # "Passed Senate", "Passed Senate with substitute", "... Block Vote"
      - '^defeated by (house|senate)\b'
      - '^agreed to by (house|senate)\b'                   # resolutions adopted
      - '^(house|senate) (substitute|amendments?)\b.*\b(agreed to|rejected) by (house|senate)\b'   # concurrence
      - '^conference report (agreed to|rejected) by (house|senate)\b'
      - '^(house|senate) acceded to request'               # "Accede Conference Committee R", new wording
      - '^(house|senate) concurred in governor'            # governor's recommendations
      # needs a disposition: LIS also logs "Governor's recommendation received by House" (not a vote)
      - '^governor''s (amendment|recommendation)s?\b.*\b(agreed to|adopted|rejected|passed by|defeated)'
    default: null

  # OPEN-687 (Oklahoma, gate E). The motion text is the link text of a floor roll call on a bill's
  # _VOTES.HTM page (oklegislature.gov/cf/<years> SUPPORT DOCUMENTS/votes/House|Senate/<bill>_VOTES.HTM),
  # title-cased by the ok scraper: "THIRD_READING (RCS# 0695)" -> "Third Reading". Rules written from 287
  # roll calls on 121 vote pages (72 bills) of 2025-2026 (read 2026-11-20). Committee roll calls never reach here:
  # the ok scraper labels them committee-passage from where they come from (vote_classification() in
  # ok/bills.py). "Third Reading" is the floor passage vote (lost ones too). "Fourth Reading" is the final
  # passage vote taken again after the chamber adopts a conference committee report or the other chamber's
  # amendments (Oklahoma adopts a CCR or concurs by voice and then votes the bill on fourth reading):
  # passage (pa OPEN-617, la OPEN-583). The veto overrides seen are whole-bill (SB 1050, HB 2785 of 2025).
  # "Adopt Resolution" is the floor vote that adopts a resolution. Not passage (left unlabelled):
  # "Emergency" (the emergency-clause roll call; the bill stands without it), "Advance" (Senate: advance
  # from General Order to third reading), "Reconsider Measure", "Appeal Of The Decision Of The Chair";
  # "Adopt Amendment" / "Table Amendment" are labelled amendment by the scraper.
  ok:
    passage:
      - '^(third|fourth)\s+reading$'
      - '^veto\s+override\s+(no\s+emergency|with\s+emergency|without\s+emer\.?|with\s+emer\.?)$'   # whole bill; an unseen line-item text stays unlabelled
      - '^adopt\s+resolution$'
    default: null                                # anything not seen stays unclassified, never passage

  # OPEN-478/479/480 (push-button onboarding, pilot #2). Rules written from the real motion texts of
  # the first full production scrape of each state (Mac replica, 2026-11-06). Anything not matched
  # stays unclassified ([]): it is better to leave a vote unclassified than to call it passage.
  # The pa, ne and la scrapers keep a few classifications of their own that this file does not
  # produce ("amendment" for a concurrence in amendments / an amendment vote, "reading-3" for LA's
  # third-reading votes); the scrapers apply those first and call classify_motion() for the rest.
  pa:
    not_passage:
      - "^motion to "                            # table, suspend rules, reconsider, proceed, appeal ruling of the chair
      - "^constitutionality"                     # constitutionality of a bill: a ruling, not passage
      - "^re-referred"
      - "^recommit"
      - '^committee vote \(.*?\): (adopt|vote to table|re-refer)'
      - '^a\d+$'                                # a bare amendment number ("A1363") is an amendment vote
    committee_passage:
      - '^committee vote \(.*?\): (re-)?report(ed)?( bill)? as (committed|amended)'
    passage:
      - "^final passage"                         # also "FINAL PASSAGE - RECONSIDERATION" / "FINAL PASSAGE-RECONSIDERED"
      # OPEN-582: a floor roll call with no Action is the vote on the measure itself, and the
      # scraper stores the measure's name as its text. On a resolution that is the adoption vote
      # (HR 401, 2026-02-04: "House Resolution 401", history "Adopted (194-4)"; SR 94, 2025-05-12).
      # A bill's ("House Bill 1663") stays unclassified: HB 1663's two of 2025-12-16 were cast the
      # day it was amended on second consideration and re-committed; its final passage was a
      # "FINAL PASSAGE" roll call the next day.
      - '^(house|senate) resolution \d+$'
      # OPEN-617: a chamber's vote to concur in the other chamber's amendments is its last vote on
      # the bill, and passage (la, nc, ut precedent). The House's text is a bare "CONCURRENCE", the
      # Senate's names the amendments. "AS AMENDED" is a concurrence that also amends them (the bill
      # goes back to the other chamber); it is still that chamber's vote on the bill's final text.
      # All 79 stored votes of 2025-2026 match a same-day "House/Senate concurred in ..." entry in
      # the voting chamber's bill history (Mac replica, 2026-11-17; SB 160's House vote of
      # 2025-11-12 on palegis.us, 156-47, since the scraper drops that entry). Any other concur
      # text stays unclassified.
      - "^concurrence$"                                          # House
      - "^concur in (house|senate) amendments$"                  # Senate (and the House's form, if it ever names them)
      - "^concur in (house amendments to senate|senate amendments to house) amendments$"
      - "^concurrence in (house|senate) amendments as amended$"
    default: null

  ne:
    not_passage:
      - "^advanced to enrollment"                # General File / Select File advancement, not final passage (Utah precedent)
      - "^failed to advance"
      - "^returned to select file"
      - "^motion to return"
      - "^adopted$"
      - "notwithstanding the objections"         # governor's veto override attempt
      - ' (adopted|lost|failed|prevailed|withdrawn)$'   # "Hansen AM1097 lost", "Arch AM1312 adopted", "Dorn MO30 prevailed"
    passage:
      - "^(passed|failed) on final reading"      # includes "with Emergency Clause" and "Emergency Clause stricken"
    default: null

  la:
    preprocess: strip_sequence_number
    not_passage:
      - "^amendment"                             # "AMENDMENT # 3891 BY AMEDEE, MOTION TO ADOPT"
      - "^motion to reconsider"
    passage:
      - "final pass(age|ge)"                     # "FINAL PASSAGE", "BY CLOUD, FINAL PASSAGE", "FINAL PASSAGE, SB 444 BY EDMONDS"
      # OPEN-583: a bill's last floor vote is often a concurrence or a conference report, and a
      # resolution's is its adoption (ut, mi, wa, va, al, nc precedent). Each text below was checked
      # against the bill history's own entry for that day and chamber (Mac replica, 2026 session):
      - "^concur in (senate|house) amendments$"  # House: "Read by title, roll called, ..., Senate amendments concurred in."
      - "^adopt conference report$"              # House: "Conference Committee Report read, roll called, ... adopted."
      - "^concur$"                               # Senate: "Amendments proposed by the House read and concurred in ...",
                                                 # or a House concurrent resolution "... concurred in by a vote of ..."
      - "^adopt$"                                # Senate: "Conference Committee Report read; adopted ..." (HB, SB),
                                                 # or a Senate resolution "Read by title and adopted ..." (SR, SCR)
      - "^final consideration$"                  # House: a resolution "... roll called on final consideration ... adopted"
    # Left unclassified (default): "REJECT" / "REJECT SENATE AMENDMENTS" (refuse the other chamber's
    # amendments, a conference follows), "CO-AUTHORS", "MODIFY TIME LIMITS" and other procedure.
    default: null

  # OPEN-527 (Alabama, gate E). The motion text is ALISON's action text for the roll call, with its
  # result on the end ("Motion to Read a Third Time and Pass - Adopted Roll Call 1009"), sometimes
  # behind the mover's name ("Orr motion to Adopt ..."), so the patterns are not anchored at either
  # end. Rules written from the real 2026rs texts (Mac replica + ALISON, 2026-11-10). An amendment or
  # substitute adoption ("Motion to Adopt" on a row with an amdSub) is labelled "amendment" by the al
  # scraper before this is called; a "Motion to Adopt" with no amdSub is a resolution's adoption (or,
  # once, a local bill's final Senate vote) and is passage here.
  al:
    not_passage:
      - "^third reading in (house of origin|second house)$"   # carries the budget isolation resolution roll call, not passage
      - "^in conference committee$"              # shares the roll call of the "motion to Accede" row
      - "non-concur"                             # "Non-Concur and Appoint Conference Committee"
      - "motion to accede"                       # accede to the other house's conference request, appoint conferees
      - "motion to table"
      - "previous question"
      - "petition to c(lose|ease) debate"
      - "add cosponsor"
      - "local certification resolution"         # certifies a local bill's notice, not a vote on the bill
    passage:
      - "motion to read a third time and pass"   # also "... as Amended", and "- Lost" (a failed passage vote)
      - "motion to adopt"                        # resolution adoption (amendments are labelled by the scraper first)
      - "concur(-| )in and adopt"                # concurrence in amendments / conference report = passage (ut, mi, wa, va)
    default: null

  # OPEN-572 (North Carolina, gate E). The motion text is the "Subject" column of the bill page's vote
  # table. Rules written from every stored NC motion text (Mac replica, sessions 2025 and 2025E1,
  # 781 roll calls, 2026-11-15). NC reads a bill a second and a third time; the second-reading roll call
  # is the recorded vote and the third reading usually follows the same day without one (421 of 439
  # "Second Reading" roll calls). Revenue bills and bills ruled material need a roll call on both
  # readings, and then the third-reading one is the passage. So a bare "Second Reading" is listed under
  # not_passage here and the nc scraper calls it passage when no later second- or third-reading roll
  # call of the same chamber follows it on the bill (vote_classification() in nc/bills.py).
  # The same split holds for a conference report or concurrence "ruled material": R2 (second reading)
  # is not passage, R3 (third reading) is.
  nc:
    not_passage:
      - "^second reading$"                       # see above: the scraper decides from the bill's later roll calls
      - '^a\d+ '                                 # House amendment: "A1 Chesser Second Reading", "A4 Morey R2 For Adoption"
      - '^amendment \d+'                         # Senate amendment: "Amendment 1", "Amendment 2  Motion 1 To Table"
      - "previous question"                      # "Veto Override M4 Previous Question", "Second Reading M4 Previous Question"
      - "to (lay on the )?table"
      - "reconsider"                             # "M6 Reconsider"
      - "^second reading motion "                # "... Motion 9 To Concur" (third reading follows), "... Motion 12/Divide", "/Appeal Ruling of Chair"
      - "not concur"                             # "M11 Not Concur": the House refuses the Senate's changes, a conference follows
      - "^r2 ruled mat'l"                        # second-reading roll call on a conference report / concurrence ruled material
      - "^conference rpt second reading$"
    passage:
      - "^third reading$"
      - "^third reading motion 9 to concur$"     # concurrence on its third reading (the second one is not passage)
      - "^conference rpt third reading$"         # Senate adopts a conference report (ut, mi, va, al precedent)
      - "^conference (report|rpt) motion 8 to adopt$"
      - "^(r3 ruled mat'l )?c rpt adoption$"     # House adopts a conference report, R3 = its third reading when ruled material
      - "^(r3 ruled mat'l )?m11 concur"          # House concurs in Senate amendments ("M11 Concur Sen. Amd. 1" too)
      - "^motion 9 to concur"                    # Senate concurs in House amendments ("... House Amend" too); a failed one is a lost passage vote
      - "^motion 8 to adopt$"                    # Senate adopts a simple resolution
      - "^r2 for adoption$"                      # House adopts a simple resolution (one reading)
      - "veto override"                          # "Veto Override", "Motion 11 Veto Override": Ramon, 2026-11-16, "Veto overrides count as passage" (unlike ma, ne); "... M4 Previous Question" stays procedure
    default: null

  # Nevada (OPEN-595). The scraper reads the first vote list on each bill's NELIS Votes tab, the one
  # headed "Final Passage" (GetBillVotes?voteTypeId=3): each chamber's third-reading roll call. Its
  # label is the chamber and the version voted on, "Assembly (1st Reprint)", "Senate (As Introduced)",
  # with " (2)" added by the scraper when the same label repeats on one day. Every text seen has this
  # shape (2025 session 83: 1,343 votes, 12 texts; 2025Special36: 33 votes); a failed one stays
  # passage (AB 500, 20-22). Anything else (a veto override in 2027, a new label) is left
  # unclassified so it shows up rather than counting as final passage.
  nv:
    passage:
      - '^(assembly|senate) \((as introduced|\d+(st|nd|rd|th) reprint)\)( \(\d+\))?$'
    default: null

  # OPEN-683 (Rhode Island, gate E). The motion text is the motion lines at the end of a roll call's header on the
  # chamber's vote report (webserver.rilegislature.gov/SVotes|HVotes/votereport.asp), joined with " / " by the ri
  # scraper (vote_motion() in ri/bills.py). Rules written from every roll-call header of 2025 and 2026 (2,948 on the
  # vote-date lists, 2,473 tied to a bill, read 2026-11-20). Passage is a motion made only of the lines below, in
  # any order: House "PASSAGE", "PASSAGE / AS AMENDED", "PASSAGE / IN CONCURRENCE (/ AS AMENDED)"; Senate "Passage",
  # "Passage as Amended (/ Passage)", "In Concurrence (/ Passage)". "In Concurrence" is the second chamber passing
  # the other chamber's bill (or the first agreeing to its amendments): passage either way (pa OPEN-617, la
  # OPEN-583). A lost vote is a lost passage vote. Any other line makes it not passage: an amendment vote
  # ("PASSAGE / PASSAGE OF AMENDMENT", "Approval of Amendment / Passage": the Senate keeps "/ Passage" on the
  # amendment vote and then votes "Passage as Amended / Passage"; labelled "amendment" by vote_classification()),
  # "RECONSIDERATION", "RULING OF THE CHAIR", a header with no motion line (a point of order, an
  # immediate-consideration vote: its text is then a title fragment or the item number), and the House budget's
  # article-by-article votes, written "ARTICLE 2 PASSAGE / AS AMENDED" by the scraper.
  ri:
    passage:
      - '^(passage( as amended)?|as amended|in concurrence)( / (passage( as amended)?|as amended|in concurrence))*$'
    default: null                                # anything else (an unseen line, a title fragment) stays unclassified

  # OPEN-597 (Oregon, gate E). The motion text is the ActionText of a MeasureHistoryActions row that carries
  # a roll call (floor votes only). Committee votes come from CommitteeAgendaItems and are labelled
  # committee-passage by the or scraper from where they come from, without this block. Rules written from
  # every floor motion text the OpenStates API publishes for 2025R1 and 2026R1 (1,976 floor roll calls,
  # 2026-11-16). Texts end with the outcome ("Passed.", "Failed.", "Adopted.", "... failed."); the label
  # names the kind of vote whatever the outcome, so a lost third reading is a lost passage vote (pa, al, nc).
  or:
    not_passage:
      - "motion to (re-?refer|rerefer|refer) "   # "Motion to re-refer to Revenue failed.", "... rerefer to Committee on Rules carried."
      - "motion to withdraw from "               # "Motion to withdraw from committee on Rules failed."
      - "motion to substitute minority report"   # "... for Committee Report failed."
      - "on the table"                           # "Motion to lay bill, together with Governor's message, on the table carried."
      - "motion to table"
      - "reconsider"                             # "Vote reconsideration carried.", "Motion to reconsider carried."
      - "motion to postpone"
      - "refused to concur"                      # the chamber refuses the other's amendments; a conference follows
      - "taken from .* calendar"                 # "Rules suspended. Third reading. Taken from 06-24 Calendar and placed on 06-25 Calendar."
      - "made a special order of business immediately"
    passage:
      - "third reading\\b"                       # "... Carried by X. Passed.", "... Failed.", "... Bill failed."; also "as Special Order of Business"
      - "^passed\\.?$"                           # House roll call recorded after a separate "Third reading. Carried by X." line
      - "^carried by .*\\bpassed\\.?$"
      - "^repassed\\.?$"
      - "final reading\\b"                       # resolution adoption: "Final reading. Carried by X. Adopted."
      - "read final time"                        # "Under the provisions of the Report of the Committee on Permanent Organization ..."
      - "^(rules suspended\\. )?read\\. carried by "   # resolution adoption: "Read. Carried by X. Adopted."
      - "read as special order of business\\. carried by "   # resolution adoption
      - "resolution adopted in conjunction with" # "Rules suspended. Resolution adopted in conjunction with the 2025 Rules of the House."
      - "concurred in (house|senate) amendments and re(passed|adopted)"   # concurrence = passage (ut, mi, wa, va, al, nc)
      - "adopted conference committee report"    # conference report adoption = passage (ut, mi, va, al, nc)
      - "notwithstanding governor['’]s veto"      # FOR RAMON: veto override counted as passage, as nc (Ramon, 2026-11-16); ma and ne do not
    default: null

  # OPEN-677 (Wyoming, gate E). The motion text is the roll call's action from Wyoming's bill API
  # (lsoservice.wyoleg.gov/api/BillInformation), with the tally on the end ("S 3rd Reading:Passed 31-0-0-0-0")
  # and, for an amendment, conference report or veto, its number in front ("SF0001JC001: H Adopted
  # SF0001JC001: 59-1-2-0-0"). Rules written from every roll call of the 2026 probe sample (107, 2026-11-20).
  # Amendment, line-item veto and introduction votes are not passage: the wy scraper labels them
  # ("amendment", "veto-override", "reading-1") after this returns [] (vote_classification() in wy/bills.py).
  wy:
    committee_passage:
      - ':recommend (amend and )?do pass\b'      # "S01 - Judiciary:Recommend Do Pass 4-0-1-0-0", "... Amend and Do Pass ..."
    passage:
      - '^[sh] 3rd reading:(passed|failed)\b'    # a lost third reading is a lost passage vote (pa, al, nc, or)
      - '^[sh] concur:(passed|failed)\b'         # concurrence in the other chamber's amendments = passage (pa OPEN-617, la OPEN-583)
      - '\b[sh] adopted [a-z]{2}\d+jc\d+\b'      # conference committee report adopted = passage (pa, la, ut, mi, nc, or)
    default: null                                # anything not seen ("Did Not Concur", a whole-bill veto override, ...) stays unclassified

  # OPEN-679 (North Dakota, gate E). The motion text is the vote modal's title on the bill-actions page
  # (ndlegis.gov/assembly/<n>-<year>/regular/bill-actions/ba<number>.html) wrapped by the scraper as
  # "Motion for <title> on <bill>". Read 2026-11-20 on 20 bills of 2025 and 5 of 2023 (incl. conference
  # reports, a veto, a reconsideration): only two titles exist. "Final Passage" is the "Second reading,
  # passed/failed" roll call (North Dakota has no third reading), and is also the roll call taken again after
  # concurring in amendments or adopting a conference report. "Consideration of Amendments" (a division or
  # amendment roll call) is not passage: the nd scraper labels it "amendment" after this returns []
  # (vote_classification() in nd/bills.py). Veto overrides are journal-only (no modal), so none reach here.
  nd:
    passage:
      - '^motion for final passage on '         # passed or failed, as amended or not, after concurrence or a conference report
    default: null                                # an unseen title stays unclassified, never passage

  # OPEN-682 (Idaho, gate E). The motion text is the text in front of the tally on a bill page's action row
  # (legislature.idaho.gov/sessioninfo/<year>/legislation/<bill>/), hyphens removed by the id scraper; when the
  # tally row has no text of its own, the scraper uses the action row just above it (parse_vote() in id/bills.py).
  # Idaho's bill pages carry only the vote on the bill itself (a third reading, or the same reading under
  # suspended rules), the origin chamber's vote on the other chamber's amendments, a concurrent resolution's
  # adoption, veto overrides and a re-vote after reconsideration: every roll call of 2025 and 2026 (1,708 on 1,607
  # bill pages, read 2026-11-20) is one of these. A lost vote is a lost passage vote (pa, al, nc, or). Anything
  # else stays unclassified, never passage.
  id:
    passage:
      - '^read third time\b'                     # "Read Third Time in Full", "... as amended", "... as amended in the Senate" (concurrence = passage, pa OPEN-617, la OPEN-583)
      - '\bread in full as required\b'           # "Rules Suspended: Ayes 68 Nays 0 Abs/Excd 2, read in full as required", "Rules Suspended (2/3 Vote  Read in full as required)": passed the same day
      - '^read in full\b'                        # a concurrent resolution adopted on the tenth order ("Read in full – ADOPTED")
      - '^(senate|house) vote to override veto$' # "Senate vote to override veto" (2025 S 1023): a whole-bill override counts (Ramon, OPEN-677); a line-item one does not match
      - '^motion to reconsider\s+passed$'        # the row above a text-less tally: the re-vote on the bill after a reconsider motion carried (2026 H 760, Senate, failed 15-20); a roll call on the motion itself ("Motion to reconsider –") does not match
    default: null                                # an unseen text stays unclassified
